<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gorg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/animation.css">
    <style>
        html, body { overflow: hidden; background: var(--surface-dark); }
        .stage {
            min-height: 100vh; min-height: 100dvh;
            padding-top: 0;
            justify-content: center;
            overflow: hidden;
            /* allow top of flowers to breathe — no top clip */
            align-items: center;
        }
        .bouquet-scene {
            position: relative;
            width: min(760px, 96vw);
            height: min(62vh, 520px);
            min-height: 420px;
            display: block;
            z-index: 3;
            overflow: visible;
            /* lower bouquet slightly so blooms sit below mid-text */
            margin-top: 54px;
        }
        .bouquet {
            position: absolute;
            inset: 0;
            display: block;
            overflow: visible;
        }
        .sunflower {
            position: absolute;
            bottom: 0;
            left: 50%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transform-origin: bottom center;
            will-change: transform;
            overflow: visible;
        }
        /* bouquet layout — stems converge at base */
        .s1 { --tilt: 0deg; --stem-h: 58%; --flower: 168px; --center: 78px; --petal-w: 44px; --petal-h: 70px; left: 50%; width: 220px; height: 100%; z-index: 4; }
        .s2 { --tilt: -7deg; --stem-h: 50%; --flower: 132px; --center: 62px; --petal-w: 36px; --petal-h: 58px; left: 34%; width: 180px; height: 92%; z-index: 3; }
        .s3 { --tilt: 7deg;  --stem-h: 52%; --flower: 138px; --center: 64px; --petal-w: 37px; --petal-h: 60px; left: 66%; width: 180px; height: 92%; z-index: 3; }
        .s4 { --tilt: -12deg; --stem-h: 42%; --flower: 106px; --center: 50px; --petal-w: 30px; --petal-h: 48px; left: 22%; width: 150px; height: 84%; z-index: 5; }
        .s5 { --tilt: 11deg;  --stem-h: 44%; --flower: 110px; --center: 52px; --petal-w: 31px; --petal-h: 50px; left: 78%; width: 150px; height: 84%; z-index: 5; }
        .sunflower { transform: translateX(-50%) rotate(var(--tilt)); }

        .message-block {
            position: absolute;
            left: 50%;
            /* move text HIGHER so it does not bisect blooms — blooms sit lower now */
            top: 34%;
            transform: translate(-50%, -50%);
            margin: 0;
            width: min(760px, calc(100% - 32px));
            z-index: 11;
            pointer-events: none;
            text-align: center;
            overflow: visible;
        }
        .message-title {
            text-shadow: 0 2px 28px rgba(0,0,0,0.7), 0 12px 40px rgba(0,0,0,0.55), 0 1px 0 rgba(0,0,0,0.45);
        }
        .replay-hint {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.58);
            font-family: var(--font-body);
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer;
            padding: 9px 16px;
            border-radius: 9999px;
            backdrop-filter: blur(8px);
            transition: color 160ms ease, background 160ms ease, border-color 160ms ease;
        }
        .replay-hint:hover { color: #fff; background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.18); }

        .music-toggle {
            position: absolute;
            bottom: 22px;
            right: 22px;
            z-index: 12;
            width: 40px;
            height: 40px;
            border-radius: 9999px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
        }
        .music-toggle:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); transform: scale(1.04); }
        .music-toggle[aria-pressed="true"] { background: #fff; color: #0c0a09; border-color: #fff; }
        .music-hint {
            position: absolute;
            bottom: 68px;
            right: 22px;
            z-index: 12;
            background: rgba(0,0,0,0.48);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.82);
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
            padding: 6px 10px;
            border-radius: 9999px;
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 300ms ease, transform 300ms ease;
            pointer-events: none;
        }
        .music-hint.is-visible { opacity: 1; transform: translateY(0); }

        .ribbon {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            width: 76px;
            height: 34px;
            z-index: 6;
            opacity: 0;
            overflow: visible;
        }
        .ribbon.is-visible { animation: ribbonIn 600ms cubic-bezier(0.22,1,0.36,1) forwards; animation-delay: 1600ms; }
        @keyframes ribbonIn { from { opacity:0; transform: translateX(-50%) translateY(8px) scale(0.96);} to {opacity:1; transform: translateX(-50%) translateY(0) scale(1);} }
        .ribbon-knot {
            position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
            width: 22px; height: 18px; background: #d9c7a0; border-radius: 4px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 2px 8px rgba(0,0,0,0.35);
        }
        .ribbon-tail {
            position: absolute; top: 14px; width: 22px; height: 28px;
            background: linear-gradient(to bottom, #e8d9b8, #d9c7a0);
            border-radius: 0 0 3px 3px;
        }
        .ribbon-tail.left { left: 12px; transform: rotate(-12deg); }
        .ribbon-tail.right { right: 12px; transform: rotate(12deg); }

        @media (max-width: 640px) {
            .bouquet-scene { height: 50vh; min-height: 360px; margin-top: 68px; width: 96vw; }
            .s1 { --flower: 138px; }
            .s2 { --flower: 108px; left: 33%; }
            .s3 { --flower: 114px; left: 67%; }
            .s4 { left: 19%; --flower: 86px; }
            .s5 { left: 81%; --flower: 90px; }
            .message-block { top: 30%; }
        }
        @media (max-height: 740px) {
            .bouquet-scene { margin-top: 42px; height: 58vh; }
            .message-block { top: 32%; }
        }

        /* ——— butterflies ——— */
        .butterflies {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            overflow: visible;
        }
        .butterfly {
            position: absolute;
            width: 30px;
            height: 22px;
            display: block;
            opacity: 0;
            will-change: transform;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.22));
        }
        .butterfly.is-flying { opacity: 1; }
        .bf-body {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2px;
            height: 13px;
            background: #2a1c07;
            border-radius: 999px;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
        }
        .bf-body::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -3px;
            width: 6px;
            height: 4px;
            border-left: 1px solid #2a1c07;
            border-right: 1px solid #2a1c07;
            border-top: 1px solid #2a1c07;
            border-radius: 50% 50% 0 0;
            transform: translateX(-50%) rotate(0deg);
            opacity: 0.9;
        }
        .bf-wing {
            position: absolute;
            top: 1px;
            width: 15px;
            height: 15px;
            border-radius: 68% 32% 62% 38%;
            opacity: 0.96;
            z-index: 2;
        }
        .bf-wing.left {
            left: 0;
            transform-origin: 100% 50%;
            animation: flapL 110ms ease-in-out infinite alternate;
            border-radius: 72% 28% 58% 42%;
        }
        .bf-wing.right {
            right: 0;
            transform-origin: 0% 50%;
            animation: flapR 110ms ease-in-out infinite alternate;
            border-radius: 28% 72% 42% 58%;
        }
        /* pastel fills cycle every 4 — dynamic count */
        .butterfly:nth-child(4n+1) .bf-wing { background: radial-gradient(ellipse at 30% 30%, #fff8e0 0%, #f4c5a8 32%, #e8a07a 72%); border: 1px solid rgba(61,43,14,0.12); }
        .butterfly:nth-child(4n+2) .bf-wing { background: radial-gradient(ellipse at 30% 30%, #f0fff8 0%, #a7e5d3 34%, #7ecfba 74%); border: 1px solid rgba(24,52,38,0.10); }
        .butterfly:nth-child(4n+3) .bf-wing { background: radial-gradient(ellipse at 30% 30%, #f6f0ff 0%, #c8b8e0 36%, #a89ac8 76%); border: 1px solid rgba(48,36,66,0.12); }
        .butterfly:nth-child(4n+4) .bf-wing { background: radial-gradient(ellipse at 30% 30%, #f0f7ff 0%, #a8c8e8 36%, #82a9d0 76%); border: 1px solid rgba(28,44,66,0.11); }
        .butterfly.small { width: 24px; height: 18px; }
        .butterfly.small .bf-wing { width: 12px; height: 12px; top: 2px; }
        .butterfly.small .bf-body { height: 11px; }

        @keyframes flapL {
            0% { transform: rotateY(0deg) rotate(-6deg) scaleX(1); }
            100% { transform: rotateY(-58deg) rotate(-6deg) scaleX(0.62); }
        }
        @keyframes flapR {
            0% { transform: rotateY(0deg) rotate(6deg) scaleX(1); }
            100% { transform: rotateY(58deg) rotate(6deg) scaleX(0.62); }
        }

        /* flight paths — 4 variants, assigned dynamically */
        .butterfly.flight1 { animation: flight1 var(--dur, 9.2s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
        .butterfly.flight2 { animation: flight2 var(--dur, 10.5s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
        .butterfly.flight3 { animation: flight3 var(--dur, 8.4s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
        .butterfly.flight4 { animation: flight4 var(--dur, 11s) ease-in-out infinite; animation-delay: var(--delay, 0s); }

        @keyframes flight1 {
            0%   { transform: translate(0, 0) rotate(-8deg) scale(0.9); opacity: 0; }
            6%   { opacity: 1; }
            22%  { transform: translate(86px, -42px) rotate(6deg) scale(1); }
            44%  { transform: translate(168px, -18px) rotate(-4deg) scale(1); }
            66%  { transform: translate(118px, 26px) rotate(10deg) scale(0.95); }
            84%  { transform: translate(42px, 14px) rotate(-10deg) scale(0.9); }
            100% { transform: translate(0, 0) rotate(-8deg) scale(0.9); opacity: 1; }
        }
        @keyframes flight2 {
            0%   { transform: translate(0, 0) rotate(12deg) scale(0.92); opacity: 0; }
            8%   { opacity: 1; }
            24%  { transform: translate(-72px, -36px) rotate(-8deg) scale(1); }
            48%  { transform: translate(-132px, -8px) rotate(6deg) scale(1); }
            68%  { transform: translate(-84px, 28px) rotate(-6deg) scale(0.96); }
            90%  { transform: translate(-22px, 10px) rotate(8deg) scale(0.92); }
            100% { transform: translate(0, 0) rotate(12deg) scale(0.92); opacity: 1; }
        }
        @keyframes flight3 {
            0%   { transform: translate(0, 0) rotate(-6deg) scale(0.86); opacity: 0; }
            10%  { opacity: 1; }
            26%  { transform: translate(54px, -18px) rotate(8deg) scale(0.95); }
            52%  { transform: translate(112px, -32px) rotate(-6deg) scale(0.95); }
            74%  { transform: translate(68px, -6px) rotate(7deg) scale(0.88); }
            100% { transform: translate(0, 0) rotate(-6deg) scale(0.86); opacity: 1; }
        }
        @keyframes flight4 {
            0%   { transform: translate(0, 0) rotate(5deg) scale(0.78); opacity: 0; }
            9%   { opacity: 0.9; }
            28%  { transform: translate(-46px, 18px) rotate(-7deg) scale(0.84); }
            52%  { transform: translate(-92px, -12px) rotate(9deg) scale(0.84); }
            74%  { transform: translate(-38px, -28px) rotate(-5deg) scale(0.80); }
            100% { transform: translate(0, 0) rotate(5deg) scale(0.78); opacity: 0.9; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bf-wing { animation: none !important; }
            .butterfly { animation: none !important; opacity: 0.9 !important; }
        }
        @media (max-width: 640px) {
            /* positions are now dynamic via JS inline left/top */
        }

        /* ——— sunflower petals rain — background — */
        .petal-rain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .petal-rain .petal {
            position: absolute;
            top: -28px;
            width: 11px;
            height: 17px;
            background: var(--sunflower-petal);
            border-radius: 62% 38% 62% 38% / 58% 42% 58% 42%;
            opacity: 0;
            will-change: transform;
            box-shadow: 0 1px 4px rgba(61,43,14,0.16);
            pointer-events: none;
        }
        .petal-rain .petal.alt {
            background: var(--sunflower-petal-deep);
            width: 9px;
            height: 14px;
            border-radius: 58% 42% 58% 42%;
        }
        .petal-rain .petal.tiny {
            width: 7px;
            height: 11px;
            opacity: 0.85;
        }
        @keyframes rainFall {
            0%   { transform: translate3d(0, 0, 0) rotate(0deg) translateX(0); opacity: 0; }
            8%   { opacity: 0.88; }
            50%  { transform: translate3d(var(--drift, 48px), 50vh, 0) rotate(360deg) translateX(var(--sway, 12px)); }
            100% { transform: translate3d(var(--drift, 48px), 110vh, 0) rotate(720deg) translateX(0); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .petal-rain { display: none; }
        }
    </style>
</head>
<body>
    <main class="stage" id="bloom" aria-label="Sunflower bouquet">
        <div class="sun-glow" id="sunGlow" aria-hidden="true"></div>
        <div id="petalRain" class="petal-rain" aria-hidden="true"></div>
        <div id="petalsLayer" aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; z-index:2; overflow:visible;"></div>

        <div class="message-block" id="messageBlock">
            <h1 class="message-title display-mega">
                Tanisha! You are looking<br>
                <span class="glow-text"><em>really gorgeous</em> today!<br></span>
            </h1>
        </div>

        <div class="butterflies" id="butterflies" aria-hidden="true"></div>

        <div class="bouquet-scene" aria-hidden="true">
            <div class="bouquet" id="bouquet">
                <div class="sunflower s1">
                    <div class="stem"></div>
                    <span class="leaf leaf-a"></span>
                    <span class="leaf leaf-b"></span>
                    <div class="flower-head">
                        <div class="petals petals-back"></div>
                        <div class="petals petals-front"></div>
                        <div class="center"><span class="center-ring"></span><span class="center-core"></span></div>
                    </div>
                </div>
                <div class="sunflower s2">
                    <div class="stem"></div>
                    <span class="leaf leaf-a"></span>
                    <span class="leaf leaf-b"></span>
                    <div class="flower-head">
                        <div class="petals petals-back"></div>
                        <div class="petals petals-front"></div>
                        <div class="center"><span class="center-ring"></span><span class="center-core"></span></div>
                    </div>
                </div>
                <div class="sunflower s3">
                    <div class="stem"></div>
                    <span class="leaf leaf-a"></span>
                    <span class="leaf leaf-b"></span>
                    <div class="flower-head">
                        <div class="petals petals-back"></div>
                        <div class="petals petals-front"></div>
                        <div class="center"><span class="center-ring"></span><span class="center-core"></span></div>
                    </div>
                </div>
                <div class="sunflower s4">
                    <div class="stem"></div>
                    <span class="leaf leaf-a"></span>
                    <div class="flower-head">
                        <div class="petals petals-back"></div>
                        <div class="petals petals-front"></div>
                        <div class="center"><span class="center-ring"></span><span class="center-core"></span></div>
                    </div>
                </div>
                <div class="sunflower s5">
                    <div class="stem"></div>
                    <span class="leaf leaf-a"></span>
                    <div class="flower-head">
                        <div class="petals petals-back"></div>
                        <div class="petals petals-front"></div>
                        <div class="center"><span class="center-ring"></span><span class="center-core"></span></div>
                    </div>
                </div>
                <div class="ribbon" id="ribbon" aria-hidden="true">
                    <span class="ribbon-tail left"></span>
                    <span class="ribbon-tail right"></span>
                    <span class="ribbon-knot"></span>
                </div>
            </div>
        </div>

        <button class="replay-hint" id="replayBtn" type="button">tap to replay · R</button>
        <button class="music-toggle" id="musicToggle" type="button" aria-label="Play music from 1:05" aria-pressed="false">♪</button>
        <span class="music-hint" id="musicHint">tap to play from 1:05</span>
    </main>

    <audio id="bgMusic" preload="auto" playsinline>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <noscript>
        <style>.sun-glow,.stem,.leaf,.flower-head,.message-block{opacity:1!important;transform:none!important}</style>
    </noscript>
    <script src="./js/main.js"></script>
</body>
</html>
